[project]
name = "aura-api"
version = "0.1.0"
description = "Aura personal AI assistant backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "httpx2>=2.13,<3.0",
    "openai>=1.0,<3.0",
    "sentence-transformers>=3.0,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
